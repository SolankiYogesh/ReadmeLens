name: Release

# Cutting a release is a tag push:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

env:
  SPARKLE_VERSION: "2.9.6"

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the annotated tag object, not just its commit

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"       >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project ReadmeLens.xcodeproj \
            -scheme ReadmeLens \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            build

      - name: Verify the bundle is signed
        run: |
          APP="build/Build/Products/Release/ReadmeLens.app"
          APPEX="$APP/Contents/PlugIns/ReadmeLensQuickLook.appex"
          test -d "$APP"   || { echo "::error::no .app produced"; exit 1; }
          test -d "$APPEX" || { echo "::error::Quick Look extension missing"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || echo "::warning::app icon missing"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

          # Building with CODE_SIGNING_ALLOWED=NO leaves a linker-signed binary
          # identified by product name rather than its bundle identifier.
          # macOS then refuses to register the Quick Look extension at all.
          # Fail the build rather than shipping that again.
          for bundle in "$APP" "$APPEX"; do
            id=$(codesign -dv "$bundle" 2>&1 | sed -n 's/^Identifier=//p')
            case "$id" in
              io.dhruvex.readmelens*) ;;
              *) echo "::error::$bundle signed as '$id', expected a bundle identifier"; exit 1 ;;
            esac
          done
          echo "signed"

      - name: Package
        id: package
        run: |
          APP="build/Build/Products/Release/ReadmeLens.app"
          ZIP="ReadmeLens-${{ steps.version.outputs.version }}-macOS-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee checksums.txt
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ### Install

          Download the zip, unarchive it, and move **ReadmeLens.app** to `/Applications`.

          The build is unsigned, so macOS will block it on first launch. Right-click
          the app and choose **Open**, then confirm — or clear the quarantine flag:

          ```bash
          xattr -dr com.apple.quarantine /Applications/ReadmeLens.app
          ```
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.zip }}" \
            checksums.txt \
            --title "ReadmeLens ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes

      # Everything below feeds Sparkle: existing users see this as the
      # in-app "what's new" text and get pointed at the asset just
      # published above.
      - name: Write appcast release notes
        run: |
          ZIP="${{ steps.package.outputs.zip }}"
          NOTES="appcast_build/${ZIP%.zip}.md"
          mkdir -p appcast_build
          git tag -l --format='%(contents)' "${{ steps.version.outputs.tag }}" > "$NOTES"
          cp "${{ steps.package.outputs.zip }}" appcast_build/
          test -f docs/appcast.xml && cp docs/appcast.xml appcast_build/ || true

      - name: Install Sparkle tools
        run: |
          curl -sL --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o sparkle-tools.tar.xz
          mkdir -p sparkle-tools
          tar -xf sparkle-tools.tar.xz -C sparkle-tools

      - name: Sign the update and regenerate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set — see README ▸ Releasing"
            exit 1
          fi
          echo "$SPARKLE_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --link "https://readmelens.github.io/" \
            appcast_build

      - name: Publish the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A separate, clean clone of just main — the job's own checkout is
          # sitting on the tag and has build artifacts and a regenerated
          # project.pbxproj lying around, neither of which belong here.
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            appcast_repo
          cp appcast_build/appcast.xml appcast_repo/docs/appcast.xml
          cd appcast_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "Update appcast for ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          fi
