name: Release

# Cutting a release is a tag push:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"       >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project ReadmeLens.xcodeproj \
            -scheme ReadmeLens \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            build

      - name: Verify the bundle is signed and entitled
        run: |
          APP="build/Build/Products/Release/ReadmeLens.app"
          APPEX="$APP/Contents/PlugIns/ReadmeLensQuickLook.appex"
          test -d "$APP"   || { echo "::error::no .app produced"; exit 1; }
          test -d "$APPEX" || { echo "::error::Quick Look extension missing"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || echo "::warning::app icon missing"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

          # Building with CODE_SIGNING_ALLOWED=NO leaves a linker-signed binary
          # identified by product name, with no entitlements. macOS then
          # refuses to register the Quick Look extension and the sandbox and
          # print entitlements are simply absent. Fail the build rather than
          # shipping that again.
          for bundle in "$APP" "$APPEX"; do
            id=$(codesign -dv "$bundle" 2>&1 | sed -n 's/^Identifier=//p')
            case "$id" in
              io.dhruvex.readmelens*) ;;
              *) echo "::error::$bundle signed as '$id', expected a bundle identifier"; exit 1 ;;
            esac
          done
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::app has no entitlements"; exit 1; }
          echo "signed and entitled""

      - name: Package
        id: package
        run: |
          APP="build/Build/Products/Release/ReadmeLens.app"
          ZIP="ReadmeLens-${{ steps.version.outputs.version }}-macOS-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee checksums.txt
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ### Install

          Download the zip, unarchive it, and move **ReadmeLens.app** to `/Applications`.

          The build is unsigned, so macOS will block it on first launch. Right-click
          the app and choose **Open**, then confirm — or clear the quarantine flag:

          ```bash
          xattr -dr com.apple.quarantine /Applications/ReadmeLens.app
          ```
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.zip }}" \
            checksums.txt \
            --title "ReadmeLens ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes
